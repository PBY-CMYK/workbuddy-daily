name: Buddy 加油站每日任务

on:
  schedule:
    # 每天 01:00 UTC = 09:00 北京时间。GitHub 的 cron 走 UTC，注意换算。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '干跑模式（只查询，不做任何写操作）'
        type: boolean
        default: false

# 需要写权限：把台账 Excel 提交回仓库
permissions:
  contents: write

concurrency:
  group: buddy-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 解释器路径不写死版本号：用 command -v 动态取
      - name: 解析运行时路径
        id: runtime
        run: |
          set -euo pipefail
          echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: 环境自检
        run: |
          set -euo pipefail
          echo "node: ${{ steps.runtime.outputs.node }}"
          echo "version: ${{ steps.runtime.outputs.node_version }}"
          # 关键 secret 存在性检查（不打印明文）
          # 优先看 refreshToken（长期滚动的那份）；只配了老 accessToken 也能跑，故不在此退出
          [ -n "${{ secrets.WORKBUDDY_REFRESH_TOKEN }}" ] && echo "WORKBUDDY_REFRESH_TOKEN: present" || echo "WORKBUDDY_REFRESH_TOKEN: MISSING (将退回 WORKBUDDY_ACCESS_TOKEN 兜底)"
          [ -n "${{ secrets.WORKBUDDY_ACCESS_TOKEN }}" ] && echo "WORKBUDDY_ACCESS_TOKEN: present" || echo "WORKBUDDY_ACCESS_TOKEN: missing (若 refreshToken 也没配则必然失败)"
          [ -n "${{ secrets.GH_PAT }}" ] && echo "GH_PAT: present (refreshToken 可自动回写)" || echo "GH_PAT: missing (refreshToken 无法自动滚动，60 天后会再次失效)"
          [ -n "${{ secrets.FEISHU_WEBHOOK_URL }}" ] && echo "FEISHU_WEBHOOK_URL: present" || echo "FEISHU_WEBHOOK_URL: missing (将跳过推送)"

      # exceljs 用于写台账；版本锁在 package-lock.json 里
      - name: 安装依赖
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # 令牌自动续期：accessToken 只有 30 天寿命，写死进 Secret 必然每月失效一次
      # （2026-10-30 起连续两天签到 401 就是这个原因）。这里每天先用 refreshToken
      # 换一张新 accessToken，通过 GITHUB_ENV 传给下游步骤。
      - name: 令牌自动续期
        id: token
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/token-rotate.mjs

      - name: 执行签到与派猫猫旅行
        id: run
        env:
          # 注意：不要在这里再写 WORKBUDDY_ACCESS_TOKEN: secrets.xxx，
          # 否则会覆盖上一步续期导出的新令牌（env 优先级高于 GITHUB_ENV）。
          WORKBUDDY_USER_ID: ${{ secrets.WORKBUDDY_USER_ID }}
          WORKBUDDY_ENDPOINT: ${{ vars.WORKBUDDY_ENDPOINT || 'https://copilot.tencent.com' }}
          # 猫猫旅行走官网成长中心这一路，与签到不同 host
          WORKBUDDY_WEB_ENDPOINT: ${{ vars.WORKBUDDY_WEB_ENDPOINT || 'https://www.workbuddy.cn' }}
          # 可选：指定派猫地点 id；留空则自动取 config 的第一个
          WORKBUDDY_TRAVEL_LOCATION_ID: ${{ vars.WORKBUDDY_TRAVEL_LOCATION_ID }}
          WORKBUDDY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          WORKBUDDY_RESULT_FILE: result.json
        run: |
          set -euo pipefail
          node scripts/checkin.mjs
        continue-on-error: true

      # 追加一行到台账（history/buddy-ledger.xlsx）
      - name: 写入每日台账 Excel
        if: always()
        env:
          WORKBUDDY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          WORKBUDDY_RESULT_FILE: result.json
          WORKBUDDY_LEDGER_FILE: history/buddy-ledger.xlsx
        run: |
          set -euo pipefail
          if [ -f result.json ]; then
            node scripts/append-ledger.mjs
          else
            echo "没有 result.json，跳过记账（说明脚本在写出结果前就失败了）"
          fi
        continue-on-error: true

      - name: 推送到飞书
        # 注意：secrets 上下文不能用在 if: 条件里（workflow 解析会报
        # Unrecognized named-value: 'secrets'）。改为脚本内部自行跳过。
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          WORKBUDDY_RESULT_FILE: result.json
        run: |
          set -euo pipefail
          node scripts/notify-feishu.mjs
        continue-on-error: true

      # 把台账提交回仓库，这样你随时能翻历史
      - name: 提交台账到仓库
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f history/buddy-ledger.xlsx ]; then
            echo "没有台账文件，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/buddy-ledger.xlsx
          if git diff --cached --quiet; then
            echo "台账无变化（同日重复跑），无需提交"
            exit 0
          fi
          git commit -m "chore(ledger): $(date -u -d '+8 hours' +%F) 每日记录 [skip ci]"
          # 并发场景下先 rebase 再推，避免 non-fast-forward
          for i in 1 2 3; do
            if git push; then echo "已提交"; exit 0; fi
            echo "推送失败，第 $i 次重试……"
            git pull --rebase --autostash || true
          done
          echo "::warning::台账提交失败（不影响今日任务结论）"
        continue-on-error: true

      # 回写新 refreshToken：续期接口每次都发一张新的（旧的作废），
      # 不回写的话第二次运行就会 401 —— 这正是「每月失效一次」的根因。
      - name: 回写新 refreshToken 到 Secret
        if: always()
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/new_refresh.txt"
          if [ ! -f "$F" ]; then
            echo "本次没有产生新 refreshToken，跳过回写"
            exit 0
          fi
          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "::warning::没有 GH_PAT，refreshToken 无法滚动（60 天后会再次失效）"
            exit 0
          fi
          node scripts/push-secret.mjs --repo "$GITHUB_REPOSITORY" --name WORKBUDDY_REFRESH_TOKEN --from-file "$F"
        continue-on-error: true

      - name: 汇总结论
        if: always()
        run: |
          set -euo pipefail
          if [ -f result.json ]; then
            echo "----- result.json -----"
            cat result.json
          else
            echo "没有产出 result.json（脚本可能在写出前就失败了）"
          fi

      # 签到成功即整体成功；签到失败才让 job 变红
      - name: 判定最终状态
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f result.json ]; then
            echo "::error::未产出结果文件"
            exit 1
          fi
          if [ "$(node -e "console.log(require('./result.json').checkin.ok)")" != "true" ]; then
            echo "::error::签到未成功"
            exit 1
          fi
          echo "签到成功，任务视为成功（猫猫部分失败不影响）"
